<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <clipPath id="bg-clip">
      <rect x="0" y="0" width="1536" height="1024" rx="0" />
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1536" height="1024" fill="#F7EFE4" />

  <!-- ============ Claude asterisk ============ -->
  <g transform="translate(195,512)">
    <g fill="#DA7756">
      <g id="ray">
        <rect x="-11" y="-150" width="22" height="90" rx="11" />
      </g>
      <use href="#ray" transform="rotate(0)" />
      <use href="#ray" transform="rotate(30)" />
      <use href="#ray" transform="rotate(60)" />
      <use href="#ray" transform="rotate(90)" />
      <use href="#ray" transform="rotate(120)" />
      <use href="#ray" transform="rotate(150)" />
      <use href="#ray" transform="rotate(180)" />
      <use href="#ray" transform="rotate(210)" />
      <use href="#ray" transform="rotate(240)" />
      <use href="#ray" transform="rotate(270)" />
      <use href="#ray" transform="rotate(300)" />
      <use href="#ray" transform="rotate(330)" />
    </g>
  </g>

  <text x="330" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#1B1B18">Claude</text>
  <text x="330" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#1B1B18">Code</text>

  <!-- plus sign -->
  <text x="640" y="545" font-family="Georgia, serif" font-size="110" fill="#1B1B18" text-anchor="middle">+</text>

  <!-- ============ AKS / Kubernetes wheel ============ -->
  <g transform="translate(850,512)">
    <g fill="none" stroke="#326CE5" stroke-width="26" stroke-linecap="round">
      <circle cx="0" cy="0" r="128" />
      <g id="cog">
        <line x1="0" y1="-128" x2="0" y2="-172" />
      </g>
      <use href="#cog" transform="rotate(0)" />
      <use href="#cog" transform="rotate(45)" />
      <use href="#cog" transform="rotate(90)" />
      <use href="#cog" transform="rotate(135)" />
      <use href="#cog" transform="rotate(180)" />
      <use href="#cog" transform="rotate(225)" />
      <use href="#cog" transform="rotate(270)" />
      <use href="#cog" transform="rotate(315)" />
    </g>
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#326CE5" text-anchor="middle">AKS</text>
  </g>

  <!-- equals sign -->
  <text x="1085" y="545" font-family="Georgia, serif" font-size="110" fill="#1B1B18" text-anchor="middle">=</text>

  <!-- ============ magnifier + checkmark (diagnosis) ============ -->
  <g transform="translate(1310,470)">
    <!-- sparkle lines -->
    <g stroke="#DA7756" stroke-width="10" stroke-linecap="round">
      <line x1="-160" y1="-70" x2="-190" y2="-85" />
      <line x1="-170" y1="0" x2="-205" y2="0" />
      <line x1="-160" y1="70" x2="-190" y2="85" />
      <line x1="165" y1="-55" x2="192" y2="-70" />
      <line x1="170" y1="55" x2="197" y2="70" />
    </g>

    <!-- magnifying glass -->
    <circle cx="-10" cy="-15" r="95" fill="#FBEBDD" stroke="#DA7756" stroke-width="22" />
    <line x1="60" y1="55" x2="140" y2="135" stroke="#DA7756" stroke-width="30" stroke-linecap="round" />

    <!-- checkmark inside -->
    <path d="M -55 -15 L -15 25 L 55 -55" fill="none" stroke="#DA7756" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
