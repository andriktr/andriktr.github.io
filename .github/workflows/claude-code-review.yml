name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip drafts, bot PRs (Dependabot) and fork PRs: the action rejects bot actors,
    # and neither Dependabot nor fork runs can read this secret, so they would only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A new push to the PR supersedes a review still in progress
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read # Claude comments with its own app token, not this one
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The code-review plugin's own allowed-tools, minus gh search and gh issue view:
          # PR content is untrusted input, so keep the model's reach to this PR
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
          # For debugging, show_full_output: true prints the transcript to the (public) job log
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A run can end early and still pass without posting anything, so fail if Claude
      # ran but has never commented on or reviewed this PR. Skipped when the action
      # didn't run Claude (for example a workflow change, which it refuses to review).
      - name: Check that Claude posted a review
        if: steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | paste -sd+ - | bc)
          reviews=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | paste -sd+ - | bc)
          echo "Claude comments: $comments, reviews: $reviews"
          if [ "$comments" -eq 0 ] && [ "$reviews" -eq 0 ]; then
            echo "::error::Claude Code Review finished without posting anything on this PR"
            exit 1
          fi
